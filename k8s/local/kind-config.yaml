# kind cluster for local deployment of the chatbot platform.
# Single control-plane node configured so the nginx ingress controller can bind
# host ports 80/443 — making http://chatbot.local reachable from the browser.
#
#   kind create cluster --config k8s/local/kind-config.yaml --name chatbot
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chatbot
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
