apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: chatbot/ingestion:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis:6379
            - name: REDIS_STREAM_KEY
              value: llm-inference-logs
            - name: REDIS_CONSUMER_GROUP
              value: ingestion-workers
            - name: PRESIDIO_URL
              value: http://presidio:8080
            - name: BATCH_SIZE
              value: "50"
            - name: BATCH_TIMEOUT_MS
              value: "1000"
            - name: ENVIRONMENT
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
