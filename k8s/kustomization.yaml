apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chatbot

resources:
  # Namespace first
  - namespace.yaml

  # Postgres
  - postgres/pvc.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml

  # Redis
  - redis/configmap.yaml
  - redis/service.yaml
  - redis/deployment.yaml

  # Presidio
  - presidio/deployment.yaml
  - presidio/service.yaml

  # API
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml

  # Ingestion
  - ingestion/deployment.yaml

  # Frontend
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml

# Secrets are generated from gitignored env files (k8s/secrets/*.env), so real
# values never land in version control. disableNameSuffixHash keeps the names
# stable (postgres-secret, llm-api-keys) since deployments reference them by name.
secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env
  - name: llm-api-keys
    envs:
      - secrets/llm-api-keys.env

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: chatbot
      app.kubernetes.io/managed-by: kustomize
